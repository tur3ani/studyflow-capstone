services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyapp
      POSTGRES_USER: studyapp
      POSTGRES_PASSWORD: studyapp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - studyapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyapp -d studyapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studyapp_pgdata:
